version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Same policy as `minimumReleaseAge` in pnpm-workspace.yaml: skip releases younger than 7 days
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
